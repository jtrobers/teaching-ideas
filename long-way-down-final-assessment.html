<style>

*{box-sizing:border-box}
body{

}
.top-strip{

  text-align:center;

  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;

header{

  padding:22px 6vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
}
.brand h1{
  margin:0;
  color:var(--navy);
  font-size:31px;
  font-weight:normal;
  letter-spacing:4px;
  text-transform:uppercase;
}
.brand p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:14px;
  font-style:italic;
}
nav a{

  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:bold;
}
nav a:hover{color:var(--rust)}
.hero{
  background:linear-gradient(120deg,var(--navy-dark),var(--navy));
  color:white;
  padding:64px 7vw 58px;
  border-bottom:8px solid var(--rust);
}
.kicker{
  color:#e0a58b;
  font-size:14px;
  letter-spacing:3px;
  font-weight:bold;
  text-transform:uppercase;
  margin-bottom:12px;
}
.hero h2{
  margin:0;
  max-width:1050px;
  font-size:52px;
  line-height:1.08;
  font-weight:normal;
}
.hero h2 em{
  color:#efb49a;
  font-weight:normal;
}
main{
  max-width:1120px;
  min-height:420px;
  margin:38px auto 72px;
  padding:0 24px;
}
.back-link{
  display:inline-block;
  color:var(--navy);
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:12px;
  font-weight:bold;
}
.back-link:hover{color:var(--rust)}
footer{
  background:var(--navy-dark);
  color:white;
  text-align:center;
  padding:22px;
  border-top:6px solid var(--rust);
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
}
@media(max-width:800px){
  header{flex-direction:column;text-align:center}
